{% extends "base.html" %}

{% block title %}
    Страница не найдена
{% endblock title %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6 text-center">
            <div class="card shadow-sm border-0">
                <div class="card-body py-5">
                    <div class="display-1 text-muted mb-4">
                        <i class="bi bi-exclamation-triangle"></i>
                    </div>

                    <h1 class="display-4 fw-bold text-primary mb-3">404</h1>
                    <h2 class="h4 text-muted mb-4">Страница не найдена</h2>

                    <p class="text-muted mb-4">
                        Страницы с адресом <strong>{{ request.build_absolute_uri }}</strong> не существует!
                    </p>

                    <a href="{% url 'classes:index' %}" class="btn btn-primary">
                        <i class="bi bi-house-door"></i> Вернуться на главную
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
