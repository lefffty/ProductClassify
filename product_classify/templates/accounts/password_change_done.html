{% extends "base.html" %}

{% block title %}Пароль изменён{% endblock %}

{% block content %}
<div id="password-change-done-container" class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm text-center">
                <div class="card-body py-5">
                    <div class="display-4 text-success mb-3">
                        <i class="bi bi-check-circle"></i>
                    </div>
                    <h1 class="h4 mb-3">Пароль успешно изменён</h1>
                    <p class="text-muted mb-4">
                        Используйте новый пароль при следующем входе.
                    </p>
                    <a href="{% url 'accounts:profile' %}" class="btn btn-primary">
                        <i class="bi bi-person"></i> В профиль
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
