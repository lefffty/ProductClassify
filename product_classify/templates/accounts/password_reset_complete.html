{% extends "base.html" %}

{% block title %}
    Пароль изменён
{% endblock title %}

{% block content %}
<div id="password-reset-complete-container" class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div id="password-reset-complete-card" class="card shadow-sm text-center">
                <div class="card-body py-5">
                    <div id="password-reset-complete-icon" class="display-1 text-success mb-3">
                        <i class="bi bi-check-circle"></i>
                    </div>

                    <h1 id="password-reset-complete-header" class="h4 mb-3">
                        Пароль успешно изменён
                    </h1>

                    <p id="password-reset-complete-text" class="text-muted mb-4">
                        Теперь вы можете войти в систему с новым паролем.
                    </p>

                    <a id="password-reset-complete-login-btn"
                       href="{% url 'accounts:login' %}"
                       class="btn btn-primary">
                        <i class="bi bi-box-arrow-in-right"></i> Войти
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
