[project]
name = "productclassify"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "black>=26.5.1",
    "coverage>=7.16.0",
    "django==5.2",
    "django-bootstrap5>=26.2",
    "django-filter>=25.1",
    "dotenv>=0.9.9",
    "faker>=12.0.1",
    "loguru>=0.7.3",
    "mixer>=7.2.2",
    "parameterized>=0.9.0",
    "pillow>=12.2.0",
    "playwright>=1.62.0",
    "psycopg2>=2.9.12",
    "reportlab>=5.0.0",
]

[tool.black]
line-length = 88
target-version = ["py314"]
extend-exclude = '''
(
    migrations
    | tests
)
'''